<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Certificação — PISTOL SURVIVEL</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>*{box-sizing:border-box}body{margin:0;background:#080b0d;color:#eee;font-family:Arial,sans-serif}.wrap{max-width:920px;margin:auto;padding:28px 18px}.modern-back{display:inline-flex;align-items:center;gap:9px;padding:10px 14px;border:1px solid #3b454b;border-radius:10px;background:linear-gradient(180deg,#171d21,#0d1215);color:#f5a623;text-decoration:none;font-weight:700}.arrow{display:grid;place-items:center;width:25px;height:25px;border-radius:7px;background:#f5a623;color:#0a0d0f;font-size:17px}.hero,.card{background:#101417;border:1px solid #30373d;border-radius:16px;padding:24px;margin-top:18px}.gold{color:#f5a623}.muted{color:#9ba4aa;line-height:1.55}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.metric{background:#0b1013;border:1px solid #293238;border-radius:12px;padding:18px}.metric b{font-size:28px;color:#f5a623;display:block}.bar{height:9px;background:#28343b;border-radius:10px;overflow:hidden;margin-top:10px}.fill{height:100%;background:#f5a623}.btn{background:#b97910;border:1px solid #f5a623;color:#fff;border-radius:9px;padding:12px 16px;font-weight:bold;cursor:pointer}.btn:disabled{opacity:.5;cursor:not-allowed}.cert{border-left:4px solid #f5a623}.code{font-family:monospace;background:#080b0d;padding:7px 10px;border-radius:7px;display:inline-block}@media(max-width:600px){.grid{grid-template-columns:1fr}}</style></head><body><main class="wrap"><a class="modern-back" href="/"><span class="arrow">‹</span><span>Voltar ao painel</span></a><section class="hero"><div class="gold">CERTIFICAÇÃO PREMIUM</div><h1>Curso Avançado de Operador de Pistola e Sobrevivência Urbana</h1><p class="muted">O certificado é liberado somente após a conclusão de todas as aulas obrigatórias e aprovação integral da avaliação final.</p><div id="elig">Verificando requisitos...</div></section><section id="certs"></section></main><script>
const sb=supabase.createClient("https://scoimbbrklznkbmbncsg.supabase.co","sb_publishable_yMe73rPGgLDPTgSsaHIBeA_LTeL7bp0"),COURSE="6997480c-3a0a-46aa-ba52-73877555b26f";let user;
const esc=x=>String(x??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
async function load(){const er=await sb.rpc("course_certificate_eligibility",{p_course:COURSE,p_user:user.id});const e=er.data?.[0];if(!e){elig.innerHTML='<p class="muted">Não foi possível verificar a elegibilidade.</p>';return}const lp=Math.round((e.completed_required/Math.max(1,e.required_lessons))*100),qp=Math.round((e.approved_questions/Math.max(1,e.required_questions))*100);elig.innerHTML='<div class="grid"><div class="metric"><b>'+e.completed_required+' / '+e.required_lessons+'</b>Aulas obrigatórias<div class="bar"><div class="fill" style="width:'+lp+'%"></div></div></div><div class="metric"><b>'+e.approved_questions+' / '+e.required_questions+'</b>Questões aprovadas<div class="bar"><div class="fill" style="width:'+qp+'%"></div></div></div></div><p class="muted">'+(e.eligible?'✓ Todos os requisitos foram cumpridos. Seu certificado pode ser emitido agora.':'Complete os requisitos acima para liberar a emissão automática.')+'</p>'+(e.eligible?'<button class="btn" id="issue" onclick="issue()">Emitir meu certificado</button>':'');await loadCerts()}
async function loadCerts(){const r=await sb.from("certificates").select("verification_code,serial_number,status,issued_at,revocation_reason").eq("user_id",user.id).eq("course_id",COURSE).order("issued_at",{ascending:false});certs.innerHTML=(r.data||[]).length?'<h2>Meus certificados</h2>'+r.data.map(c=>'<article class="card cert"><h3>Certificado '+esc(c.serial_number||"")+'</h3><p>Status: <b class="gold">'+esc(c.status)+'</b></p><p>Emitido em '+new Date(c.issued_at).toLocaleDateString("pt-BR")+'</p><p>Código de verificação: <span class="code">'+esc(c.verification_code)+'</span></p>'+(c.revocation_reason?'<p class="muted">Motivo: '+esc(c.revocation_reason)+'</p>':'')+'</article>').join(""):'<div class="card muted">Você ainda não possui certificado emitido.</div>'}
async function issue(){const b=document.getElementById("issue");b.disabled=true;b.textContent="Emitindo...";const r=await sb.rpc("issue_my_certificate",{p_course:COURSE});if(r.error){alert("Não foi possível emitir: "+r.error.message);b.disabled=false;b.textContent="Emitir meu certificado";return}await load()}
(async()=>{const s=await sb.auth.getSession();user=s.data.session?.user;if(!user)return location.href="/login.html";await load()})();
</script></body></html>
