<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Meu Perfil — PISTOL SURVIVEL</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>*{box-sizing:border-box}body{margin:0;background:#080b0d;color:#f2f2f2;font:15px Arial,sans-serif}.app{max-width:900px;margin:35px auto;padding:18px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.brand{color:#f5a623;font-weight:900;letter-spacing:2px}.back{color:#f5a623;text-decoration:none}.card{background:#101417;border:1px solid #30373d;border-radius:16px;padding:25px;margin-bottom:16px}h1{margin:7px 0}h2{color:#f5a623;font-size:17px;border-bottom:1px solid #30373d;padding-bottom:10px}.muted{color:#9ba4aa}.grid{display:grid;grid-template-columns:1fr 1fr;gap:13px}.full{grid-column:1/-1}label{display:block;font-size:12px;color:#cbd1d5;margin-bottom:6px}input{width:100%;padding:12px;background:#090d0f;border:1px solid #394047;border-radius:8px;color:#fff}input:focus{outline:none;border-color:#f5a623}.btn{background:#b97910;border:1px solid #f5a623;color:#fff;padding:12px 16px;border-radius:8px;font-weight:bold;cursor:pointer}.btn.alt{background:#171c20;border-color:#3a444a}.actions{display:flex;gap:10px;margin-top:18px}.msg{min-height:20px;margin-top:12px}.account{display:flex;justify-content:space-between;gap:15px;align-items:center}@media(max-width:620px){.grid{grid-template-columns:1fr}.full{grid-column:auto}.account,.top{align-items:flex-start;flex-direction:column}}</style></head><body><main class="app"><div class="top"><div class="brand">PISTOL SURVIVEL · EDIÇÃO PREMIUM</div><a class="back" href="/">← Área do Aluno</a></div><section class="card"><h1>Meu Perfil</h1><p class="muted">Mantenha seus dados de contato e endereço atualizados.</p><h2>Dados pessoais</h2><div class="grid"><div class="full"><label>Nome completo</label><input id="name"></div><div><label>E-mail da conta</label><input id="email" disabled></div><div><label>Telefone / WhatsApp</label><input id="phone" type="tel"></div><div><label>Data de nascimento</label><input id="birth" type="date"></div></div><h2>Endereço</h2><div class="grid"><div><label>CEP</label><input id="cep"></div><div><label>UF</label><input id="state" maxlength="2"></div><div class="full"><label>Rua / Avenida</label><input id="street"></div><div><label>Número</label><input id="number"></div><div><label>Complemento</label><input id="complement"></div><div><label>Bairro</label><input id="neighborhood"></div><div><label>Cidade</label><input id="city"></div></div><div class="actions"><button class="btn" id="save">Salvar alterações</button></div><div id="msg" class="msg muted"></div></section><section class="card"><h2>Segurança da conta</h2><div class="account"><div><b>Senha de acesso</b><div class="muted">Por segurança, sua senha nunca é exibida.</div></div><button class="btn alt" id="reset">Enviar redefinição de senha</button></div><div id="securityMsg" class="msg muted"></div></section></main><script>
const sb=supabase.createClient("https://scoimbbrklznkbmbncsg.supabase.co","sb_publishable_yMe73rPGgLDPTgSsaHIBeA_LTeL7bp0");let user;
const $=id=>document.getElementById(id);
async function boot(){const x=await sb.auth.getSession();user=x.data.session?.user;if(!user)return location.href="/login.html";const r=await sb.from("profiles").select("*").eq("id",user.id).single();if(r.error){$("msg").textContent="Não foi possível carregar o perfil.";return}const p=r.data;$("name").value=p.full_name||"";$("email").value=p.email||user.email||"";$("phone").value=p.phone||"";$("birth").value=p.birth_date||"";$("cep").value=p.postal_code||"";$("state").value=p.state||"";$("street").value=p.street||"";$("number").value=p.address_number||"";$("complement").value=p.address_complement||"";$("neighborhood").value=p.neighborhood||"";$("city").value=p.city||""}
$("save").onclick=async()=>{const b=$("save");b.disabled=true;$("msg").textContent="Salvando...";const r=await sb.rpc("update_my_profile",{p_full_name:$("name").value,p_phone:$("phone").value,p_birth_date:$("birth").value||null,p_postal_code:$("cep").value,p_street:$("street").value,p_address_number:$("number").value,p_address_complement:$("complement").value,p_neighborhood:$("neighborhood").value,p_city:$("city").value,p_state:$("state").value});$("msg").textContent=r.error?"Erro ao salvar: "+r.error.message:"Perfil atualizado com sucesso.";b.disabled=false};
$("reset").onclick=async()=>{const r=await sb.auth.resetPasswordForEmail(user.email,{redirectTo:"https://pistol-survivel-premium.onrender.com/login.html"});$("securityMsg").textContent=r.error?"Não foi possível enviar a redefinição.":"Enviamos as instruções de redefinição para seu e-mail."};boot();
</script></body></html>
