<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Cadastro de Aluno</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{margin:0;background:#080b0d;color:#f2f2f2;font-family:Arial}.w{max-width:460px;margin:60px auto;padding:24px}.c{background:#101417;border:1px solid #252b30;border-radius:16px;padding:24px}input{width:100%;box-sizing:border-box;background:#0b0f11;border:1px solid #30373d;color:#fff;padding:13px;border-radius:9px;margin:7px 0}button{width:100%;background:#a86b0c;color:#fff;border:1px solid #f5a623;padding:13px;border-radius:9px;font-weight:bold;margin-top:10px}a{color:#f5a623}.m{color:#9aa2a9}</style></head><body><div class="w"><div class="c"><h1>Cadastro de Aluno</h1><p class="m">Crie sua conta para entrar na plataforma PISTOL SURVIVEL.</p><input id="name" placeholder="Nome completo"><input id="email" type="email" placeholder="E-mail"><input id="pass" type="password" placeholder="Senha (mínimo 6 caracteres)"><button id="go">CRIAR MINHA CONTA</button><p id="msg"></p><a href="/login.html">Já tenho conta</a></div></div><script>
const s=supabase.createClient("https://scoimbbrklznkbmbncsg.supabase.co","sb_publishable_yMe73rPGgLDPTgSsaHIBeA_LTeL7bp0");
const nameEl=document.getElementById("name"),emailEl=document.getElementById("email"),passEl=document.getElementById("pass"),goEl=document.getElementById("go"),msgEl=document.getElementById("msg");
goEl.onclick=async()=>{
 const n=nameEl.value.trim(),e=emailEl.value.trim(),p=passEl.value;
 if(n.length<3){msgEl.textContent="Informe seu nome completo.";return}
 if(!e||!emailEl.validity.valid){msgEl.textContent="Informe um e-mail válido.";return}
 if(p.length<6){msgEl.textContent="A senha precisa ter pelo menos 6 caracteres.";return}
 goEl.disabled=true;msgEl.textContent="Criando conta...";
 try{
  const r=await s.auth.signUp({email:e,password:p,options:{data:{full_name:n},emailRedirectTo:"https://pistol-survivel-premium.onrender.com/login.html"}});
  if(r.error){msgEl.textContent="Não foi possível criar a conta: "+r.error.message;return}
  msgEl.textContent=r.data.session?"Conta criada com sucesso. Redirecionando...":"Conta criada. Verifique seu e-mail para confirmar o cadastro.";
  if(r.data.session)setTimeout(()=>location.href="/",900);
 }catch(err){msgEl.textContent="Falha ao criar conta. Tente novamente."}
 finally{goEl.disabled=false}
};
</script></body></html>
