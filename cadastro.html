<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Cadastro de Aluno</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{margin:0;background:#080b0d;color:#f2f2f2;font-family:Arial}.w{max-width:460px;margin:60px auto;padding:24px}.c{background:#101417;border:1px solid #252b30;border-radius:16px;padding:24px}input{width:100%;box-sizing:border-box;background:#0b0f11;border:1px solid #30373d;color:#fff;padding:13px;border-radius:9px;margin:7px 0}button{width:100%;background:#a86b0c;color:#fff;border:1px solid #f5a623;padding:13px;border-radius:9px;font-weight:bold;margin-top:10px}a{color:#f5a623}.m{color:#9aa2a9}</style></head><body><div class="w"><div class="c"><h1>Cadastro de Aluno</h1><p class="m">Crie sua conta para entrar na plataforma PISTOL SURVIVEL.</p><input id="name" placeholder="Nome completo"><input id="email" type="email" placeholder="E-mail"><input id="pass" type="password" placeholder="Senha (mínimo 6 caracteres)"><button id="go">CRIAR MINHA CONTA</button><p id="msg"></p><a href="/">Já tenho conta</a></div></div><script>const s=supabase.createClient("https://scoimbbrklznkbmbncsg.supabase.co","sb_publishable_yMe73rPGgLDPTgSsaHIBeA_LTeL7bp0");go.onclick=async()=>{const n=name.value.trim(),e=email.value.trim(),p=pass.value;if(n.length<3)return msg.textContent="Informe seu nome completo.";if(p.length<6)return msg.textContent="A senha precisa ter pelo menos 6 caracteres.";msg.textContent="Criando conta...";const r=await s.auth.signUp({email:e,password:p,options:{data:{full_name:n}}});msg.textContent=r.error?r.error.message:"Cadastro realizado como ALUNO. Verifique seu e-mail se a confirmação estiver habilitada."}</script></body></html>
