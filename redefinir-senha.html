<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Redefinir senha — PISTOL SURVIVEL</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% 0,#392306,#06090b 45%);color:#f2f2f2;font-family:Arial;min-height:100vh;display:grid;place-items:center}.box{width:min(460px,92vw);background:#091014;border:1px solid #57400e;border-radius:16px;padding:32px;box-shadow:0 25px 70px #000}.logo{text-align:center;font-size:29px;font-weight:900}.logo b,h2{color:#f5a623}.sub{text-align:center;color:#9ba4aa;letter-spacing:3px;font-size:11px;margin:5px 0 28px}.muted{color:#a8afb4;line-height:1.55}label{display:block;margin:14px 0 6px;color:#cbd1d5}input{width:100%;padding:13px;border-radius:7px;border:1px solid #36434a;background:#060b0e;color:#fff}button{width:100%;padding:14px;margin-top:20px;border:0;border-radius:7px;background:#f5a623;color:#080b0d;font-weight:800;cursor:pointer}button:disabled{opacity:.6}.msg{min-height:22px;margin-top:14px;color:#ffbd52;text-align:center;line-height:1.5}a{color:#f5a623}.back{text-align:center;margin-top:18px}</style></head><body><main class="box"><div class="logo">PISTOL <b>SURVIVEL</b></div><div class="sub">EDIÇÃO PREMIUM</div><h2>Crie uma nova senha</h2><p class="muted">Informe uma nova senha para sua conta. Use no mínimo 8 caracteres.</p><form id="form"><label for="password">Nova senha</label><input id="password" type="password" minlength="8" autocomplete="new-password" required><label for="confirm">Confirmar nova senha</label><input id="confirm" type="password" minlength="8" autocomplete="new-password" required><button id="save" type="submit">SALVAR NOVA SENHA</button></form><div id="msg" class="msg" role="status" aria-live="polite"></div><div class="back"><a href="/login.html">Voltar para o login</a></div></main><script>const s=supabase.createClient("https://scoimbbrklznkbmbncsg.supabase.co","sb_publishable_yMe73rPGgLDPTgSsaHIBeA_LTeL7bp0");const form=document.getElementById("form"),msg=document.getElementById("msg"),save=document.getElementById("save"),password=document.getElementById("password"),confirm=document.getElementById("confirm");let recoveryReady=false;s.auth.onAuthStateChange((event,session)=>{if(event==="PASSWORD_RECOVERY"||session)recoveryReady=true});setTimeout(async()=>{const {data}=await s.auth.getSession();if(data.session)recoveryReady=true},500);form.onsubmit=async e=>{e.preventDefault();if(password.value!==confirm.value){msg.textContent="As senhas não coincidem.";return}if(password.value.length<8){msg.textContent="Use uma senha com pelo menos 8 caracteres.";return}save.disabled=true;msg.textContent="Atualizando sua senha...";try{const {error}=await s.auth.updateUser({password:password.value});if(error){console.error(error);msg.textContent=recoveryReady?"Não foi possível atualizar a senha. Solicite um novo link de recuperação.":"Este link de recuperação é inválido ou expirou. Solicite um novo link.";return}msg.textContent="Senha alterada com sucesso. Redirecionando para o login...";await s.auth.signOut();setTimeout(()=>location.href="/login.html",1500)}catch(err){console.error(err);msg.textContent="Não foi possível atualizar a senha agora."}finally{save.disabled=false}};</script></body></html>
