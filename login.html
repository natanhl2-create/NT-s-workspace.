<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Entrar — PISTOL SURVIVEL</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% 0,#392306,#06090b 45%);color:#f2f2f2;font-family:Arial;min-height:100vh;display:grid;place-items:center}.box{width:min(430px,92vw);background:#091014;border:1px solid #57400e;border-radius:14px;padding:30px;box-shadow:0 25px 70px #000}.logo{text-align:center;font-size:30px;font-weight:900}.logo b,h2{color:#f5a623}.sub{text-align:center;color:#9ba4aa;letter-spacing:3px;font-size:11px;margin:5px 0 25px}label{display:block;margin:13px 0 6px;color:#cbd1d5}input{width:100%;padding:13px;border-radius:7px;border:1px solid #36434a;background:#060b0e;color:#fff}button{width:100%;padding:13px;margin-top:18px;border:0;border-radius:7px;background:#f5a623;font-weight:800;cursor:pointer}.links{text-align:center;margin-top:18px;line-height:1.8}.links a{color:#f5a623;text-decoration:none}.forgot{display:block;margin-top:8px}.msg{min-height:20px;margin-top:12px;color:#ffbd52;text-align:center}</style></head><body><div class="box"><div class="logo">PISTOL <b>SURVIVEL</b></div><div class="sub">EDIÇÃO PREMIUM</div><h2>Entrar na plataforma</h2><form id="form"><label>E-mail</label><input id="email" type="email" required autocomplete="email"><label>Senha</label><input id="password" type="password" required autocomplete="current-password"><button>ENTRAR</button></form><div class="msg" id="msg"></div><div class="links">Ainda não possui conta? <a href="cadastro.html">Criar cadastro</a><a class="forgot" href="#" id="forgot">Esqueci minha senha</a></div></div><script>const s=supabase.createClient("https://scoimbbrklznkbmbncsg.supabase.co","sb_publishable_yMe73rPGgLDPTgSsaHIBeA_LTeL7bp0");(async()=>{if((await s.auth.getSession()).data.session)location.href="index.html"})();form.onsubmit=async e=>{e.preventDefault();msg.textContent="Entrando...";const {error}=await s.auth.signInWithPassword({email:email.value,password:password.value});if(error){msg.textContent="Não foi possível entrar: "+error.message;return}location.href="index.html"};forgot.onclick=async e=>{e.preventDefault();const mail=email.value.trim();if(!mail){msg.textContent="Informe seu e-mail acima para receber o link de recuperação.";email.focus();return}forgot.style.pointerEvents="none";msg.textContent="Enviando link de recuperação...";const {error}=await s.auth.resetPasswordForEmail(mail,{redirectTo:"https://pistol-survivel-premium.onrender.com/redefinir-senha.html"});forgot.style.pointerEvents="";msg.textContent=error?"Não foi possível enviar agora. Tente novamente em alguns minutos.":"Se o e-mail estiver cadastrado, enviaremos as instruções para redefinir sua senha. Confira também Spam e Lixo eletrônico."}</script></body></html>
