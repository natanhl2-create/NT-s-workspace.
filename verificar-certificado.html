<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Verificar Certificado — PISTOL SURVIVEL</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% 0,#2b1b06 0,#080b0d 38%,#050708 100%);color:#f2f2f2;font-family:Arial,sans-serif}.wrap{max-width:760px;margin:auto;padding:50px 18px}.brand{text-align:center;margin-bottom:28px}.brand h1{font-size:34px;margin:5px 0}.gold{color:#f5a623}.premium{letter-spacing:5px;color:#9ba4aa;font-size:11px}.card{background:#101417;border:1px solid #4c3b1d;border-radius:18px;padding:28px;box-shadow:0 20px 60px #0008}.muted{color:#a8b0b5;line-height:1.55}.search{display:flex;gap:9px;margin-top:20px}input{flex:1;min-width:0;background:#080c0f;color:#fff;border:1px solid #3b454b;border-radius:9px;padding:14px;font:inherit;text-transform:uppercase}input:focus{outline:none;border-color:#f5a623}.btn{background:#f5a623;color:#111;border:0;border-radius:9px;padding:14px 18px;font-weight:900;cursor:pointer}.result{margin-top:22px}.ok{border-left:4px solid #f5a623}.bad{border-left:4px solid #7d3030}.seal{font-size:42px}.data{display:grid;grid-template-columns:1fr 1fr;gap:13px;margin-top:18px}.field{background:#0a0f12;border:1px solid #293238;border-radius:10px;padding:13px}.field small{display:block;color:#929ca2;margin-bottom:5px}.back{display:inline-block;color:#f5a623;text-decoration:none;margin-top:22px}@media(max-width:600px){.search{display:grid}.data{grid-template-columns:1fr}}
</style></head><body><main class="wrap"><div class="brand"><div class="premium">EDIÇÃO PREMIUM</div><h1>PISTOL <span class="gold">SURVIVEL</span></h1><div class="muted">Verificação pública de autenticidade</div></div><section class="card"><h2>Validar certificado</h2><p class="muted">Informe o código de verificação exibido no certificado. A consulta confirma a situação registrada na plataforma.</p><form id="form" class="search"><input id="code" maxlength="80" autocomplete="off" placeholder="Código de verificação" required><button class="btn">VERIFICAR</button></form><div id="result" class="result"></div></section><a class="back" href="/">← Área do Aluno</a></main><script>
const sb=supabase.createClient("https://scoimbbrklznkbmbncsg.supabase.co","sb_publishable_yMe73rPGgLDPTgSsaHIBeA_LTeL7bp0");
const esc=x=>String(x??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
async function verify(v){const code=String(v||"").trim().toUpperCase();if(!code)return;result.innerHTML='<p class="muted">Consultando registro...</p>';const r=await sb.rpc("verify_certificate_public",{p_code:code});const c=r.data?.[0];if(r.error||!c){result.innerHTML='<div class="card bad"><b>Certificado não localizado</b><p class="muted">Confira o código informado e tente novamente.</p></div>';return}result.innerHTML='<div class="card '+(c.valid?'ok':'bad')+'"><div class="seal">'+(c.valid?'✓':'!')+'</div><h2>'+(c.valid?'CERTIFICADO VÁLIDO':'CERTIFICADO SEM VALIDADE ATUAL')+'</h2><div class="data"><div class="field"><small>Aluno</small><b>'+esc(c.student_name)+'</b></div><div class="field"><small>Número de série</small><b>'+esc(c.serial_number)+'</b></div><div class="field"><small>Curso</small><b>'+esc(c.course_title)+'</b></div><div class="field"><small>Emissão</small><b>'+new Date(c.issued_at).toLocaleDateString("pt-BR")+'</b></div></div><p class="muted">Status registrado: '+esc(c.status)+'</p></div>'}
form.onsubmit=e=>{e.preventDefault();verify(code.value)};const q=new URLSearchParams(location.search).get("code");if(q){code.value=q;verify(q)}
</script></body></html>
