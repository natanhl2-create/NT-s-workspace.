<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Área de aprendizagem — PISTOL SURVIVEL</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>*{box-sizing:border-box}body{margin:0;font-family:Arial;background:#080b0d;color:#eee}.top{padding:18px 24px;border-bottom:1px solid #293238;background:#0b1114;position:sticky;top:0}.top a{color:#f5a623;text-decoration:none}.wrap{display:grid;grid-template-columns:330px 1fr;min-height:calc(100vh - 58px)}.list{border-right:1px solid #293238;padding:16px;max-height:calc(100vh - 58px);overflow:auto}.module{color:#f5a623;font-weight:bold;margin:18px 8px 8px}.lesson{display:block;width:100%;text-align:left;background:#0d1519;color:#dce1e4;border:1px solid #263138;padding:11px;margin:5px 0;border-radius:7px;cursor:pointer}.lesson.active{border-color:#f5a623;background:#211706}.player{padding:34px;max-width:1000px}.tag{color:#f5a623;font-size:12px;font-weight:bold}.player h1{font-size:34px}.muted{color:#9ba4aa}.bar{height:8px;background:#28343b;border-radius:9px;overflow:hidden;margin:16px 0}.fill{height:100%;background:#f5a623}.actions{display:flex;gap:10px;margin-top:24px}.btn{padding:12px 16px;border-radius:7px;border:1px solid #4a5358;background:#11191d;color:#fff;cursor:pointer}.btn.primary{background:#f5a623;color:#111;border-color:#f5a623;font-weight:bold}@media(max-width:800px){.wrap{grid-template-columns:1fr}.list{max-height:40vh;border-right:0;border-bottom:1px solid #293238}.player{padding:22px}}.modern-back{display:inline-flex;align-items:center;gap:9px;padding:10px 14px;border:1px solid #3b454b;border-radius:10px;background:linear-gradient(180deg,#171d21,#0d1215);color:#f5a623!important;text-decoration:none!important;font-weight:700;font-size:13px;box-shadow:0 6px 18px #0005;transition:.2s}.modern-back:hover{transform:translateY(-1px);border-color:#f5a623;background:#1c1710;box-shadow:0 8px 24px #0008}.modern-back .arrow{display:grid;place-items:center;width:25px;height:25px;border-radius:7px;background:#f5a623;color:#0a0d0f;font-size:17px;line-height:1}.modern-back .label{white-space:nowrap}</style></head><body><div class="top"><a class="modern-back" href="index.html"><span class="arrow">‹</span><span class="label">Voltar ao painel</span></a></div><div class="wrap"><aside id="list" class="list">Carregando...</aside><main class="player"><div id="tag" class="tag">AULA</div><h1 id="title">Selecione uma aula</h1><div id="meta" class="muted"></div><div class="bar"><div id="fill" class="fill" style="width:0"></div></div><div id="content" class="muted">O conteúdo da aula será exibido aqui.</div><div class="actions"><button id="prev" class="btn" style="display:none">← Aula anterior</button><button id="complete" class="btn primary" style="display:none">✓ Marcar como concluída</button><button id="next" class="btn" style="display:none">Próxima aula →</button></div></main></div><script>
const s=supabase.createClient("https://scoimbbrklznkbmbncsg.supabase.co","sb_publishable_yMe73rPGgLDPTgSsaHIBeA_LTeL7bp0");let uid,mods=[],less=[],done=new Set(),current=null,started=Date.now();
async function saveResume(){if(!current||!uid)return;const secs=Math.max(0,Math.floor((Date.now()-started)/1000));await s.from("lesson_resume").upsert({user_id:uid,lesson_id:String(current.id),scroll_ratio:0,seconds_spent:secs,updated_at:new Date().toISOString()},{onConflict:"user_id,lesson_id"});}
async function openLesson(id){if(current)await saveResume();current=less.find(x=>String(x.id)===String(id));if(!current)return;started=Date.now();const m=mods.find(x=>x.id===current.module_id);tag.textContent="MÓDULO "+String(m?.module_no||"").padStart(2,"0");title.textContent=current.title;meta.textContent=m?.title||"";content.innerHTML=current.body?current.body:"<p>Esta aula já faz parte da estrutura do curso. O conteúdo integral ainda será publicado no player.</p>";complete.style.display="block";complete.textContent=done.has(String(current.id))?"✓ Aula concluída":"✓ Marcar como concluída";const i=less.findIndex(x=>x.id===current.id);prev.style.display=i>0?"block":"none";prev.onclick=()=>openLesson(less[i-1]?.id);next.style.display=i<less.length-1?"block":"none";next.onclick=()=>openLesson(less[i+1]?.id);history.replaceState(null,"","learning.html?lesson="+encodeURIComponent(current.id));document.querySelectorAll(".lesson").forEach(b=>b.classList.toggle("active",b.dataset.id===String(current.id)));await saveResume();}
complete.onclick=async()=>{if(!current)return;await s.from("progress").upsert({user_id:uid,lesson_id:String(current.id),completed:true,completed_at:new Date().toISOString()},{onConflict:"user_id,lesson_id"});done.add(String(current.id));complete.textContent="✓ Aula concluída";renderList();};
function renderList(){list.innerHTML=mods.map(m=>'<div class="module">MÓDULO '+String(m.module_no).padStart(2,"0")+' — '+m.title+'</div>'+less.filter(l=>l.module_id===m.id).map(l=>'<button class="lesson '+(current?.id===l.id?"active":"")+'" data-id="'+l.id+'">'+(done.has(String(l.id))?"✓ ":"○ ")+l.title+'</button>').join("")).join("");document.querySelectorAll(".lesson").forEach(b=>b.onclick=()=>openLesson(b.dataset.id));fill.style.width=Math.round(done.size/Math.max(1,less.length)*100)+"%";}
(async()=>{const a=await s.auth.getSession();if(!a.data.session)return location.href="login.html";uid=a.data.session.user.id;const [m,l,p]=await Promise.all([s.from("course_modules").select("id,module_no,title").eq("status","published").order("sort_order"),s.from("course_lessons").select("id,module_id,title,body,sort_order").eq("status","published").order("sort_order"),s.from("progress").select("lesson_id").eq("user_id",uid).eq("completed",true)]);mods=m.data||[];less=l.data||[];done=new Set((p.data||[]).map(x=>String(x.lesson_id)));renderList();const q=new URLSearchParams(location.search).get("lesson");let target=q;if(!target){const r=await s.from("lesson_resume").select("lesson_id,updated_at").eq("user_id",uid).order("updated_at",{ascending:false}).limit(1).maybeSingle();target=r.data?.lesson_id}if(!target)target=(less.find(x=>!done.has(String(x.id)))||less[0])?.id;if(target)openLesson(target)})();window.addEventListener("beforeunload",()=>{saveResume()});
</script></body></html>
